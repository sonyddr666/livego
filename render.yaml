services:
  - type: web
    name: livego
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: 20.19.0
      - key: GEMINI_API_KEY
        sync: false
      - key: APP_ORIGIN
        value: https://livego.dev,https://www.livego.dev
