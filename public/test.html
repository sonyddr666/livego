<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LiveGo â€” Modo Teste (Texto)</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg: #0a0a0f;
            --surface: #13131a;
            --surface-2: #1a1a24;
            --border: #2a2a3a;
            --text: #e4e4ec;
            --text-dim: #8888a0;
            --accent: #7c5cfc;
            --accent-glow: rgba(124, 92, 252, 0.25);
            --success: #34d399;
            --error: #f87171;
            --user-bg: rgba(124, 92, 252, 0.12);
            --gemini-bg: rgba(52, 211, 153, 0.08);
            --radius: 12px;
        }

        body {
            font-family: 'Inter', system-ui, sans-serif;
            background: var(--bg);
            color: var(--text);
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Header */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 20px;
            border-bottom: 1px solid var(--border);
            background: var(--surface);
            flex-shrink: 0;
        }

        .header h1 {
            font-size: 1.1rem;
            font-weight: 700;
            background: linear-gradient(135deg, #7c5cfc, #a78bfa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header-actions {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .connect-btn {
            padding: 7px 16px;
            border: none;
            border-radius: 8px;
            font-family: inherit;
            font-weight: 600;
            font-size: 0.8rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        .connect-btn.off {
            background: linear-gradient(135deg, #7c5cfc, #6347d6);
            color: white;
        }

        .connect-btn.on {
            background: rgba(248, 113, 113, 0.15);
            color: var(--error);
            border: 1px solid rgba(248, 113, 113, 0.3);
        }

        .connect-btn:hover {
            transform: translateY(-1px);
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--text-dim);
        }

        .status-dot.connected {
            background: var(--success);
            box-shadow: 0 0 8px rgba(52, 211, 153, 0.5);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0.5;
            }
        }

        /* Config Bar */
        .config-bar {
            display: flex;
            gap: 10px;
            padding: 10px 20px;
            border-bottom: 1px solid var(--border);
            background: var(--surface-2);
            flex-shrink: 0;
            flex-wrap: wrap;
            align-items: center;
        }

        .config-bar label {
            font-size: 0.7rem;
            font-weight: 600;
            color: var(--text-dim);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .config-bar input,
        .config-bar select {
            padding: 6px 10px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 6px;
            color: var(--text);
            font-family: inherit;
            font-size: 0.8rem;
            transition: border-color 0.2s;
        }

        .config-bar input:focus,
        .config-bar select:focus {
            outline: none;
            border-color: var(--accent);
        }

        .api-key-input {
            flex: 1;
            min-width: 200px;
        }

        .toggle-row {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .toggle-row input[type="checkbox"] {
            accent-color: var(--accent);
            width: 16px;
            height: 16px;
        }

        .toggle-row span {
            font-size: 0.78rem;
            color: var(--text-dim);
        }

        /* Chat Area */
        .chat-area {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .chat-area::-webkit-scrollbar {
            width: 6px;
        }

        .chat-area::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 3px;
        }

        .msg {
            max-width: 85%;
            padding: 12px 16px;
            border-radius: 16px;
            font-size: 0.9rem;
            line-height: 1.65;
            white-space: pre-wrap;
            word-break: break-word;
            animation: fadeIn 0.25s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(6px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .msg.user {
            align-self: flex-end;
            background: var(--user-bg);
            border: 1px solid rgba(124, 92, 252, 0.2);
            border-bottom-right-radius: 4px;
        }

        .msg.gemini {
            align-self: flex-start;
            background: var(--gemini-bg);
            border: 1px solid rgba(52, 211, 153, 0.15);
            border-bottom-left-radius: 4px;
        }

        .msg.system {
            align-self: center;
            background: var(--surface-2);
            border: 1px solid var(--border);
            font-size: 0.78rem;
            color: var(--text-dim);
            border-radius: 8px;
            padding: 8px 14px;
            text-align: center;
        }

        .msg .label {
            font-size: 0.68rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 4px;
            display: block;
        }

        .msg.user .label {
            color: #a78bfa;
        }

        .msg.gemini .label {
            color: var(--success);
        }

        .tool-call {
            font-size: 0.78rem;
            margin-top: 8px;
            padding: 8px 10px;
            background: rgba(255, 255, 255, 0.04);
            border-radius: 6px;
            border: 1px solid var(--border);
            color: var(--text-dim);
        }

        .tool-call summary {
            cursor: pointer;
            color: #a78bfa;
            font-weight: 500;
        }

        .tool-call pre {
            margin-top: 6px;
            font-size: 0.72rem;
            white-space: pre-wrap;
        }

        /* Input Bar */
        .input-bar {
            display: flex;
            gap: 10px;
            padding: 14px 20px;
            border-top: 1px solid var(--border);
            background: var(--surface);
            flex-shrink: 0;
        }

        .input-bar textarea {
            flex: 1;
            padding: 10px 14px;
            background: var(--surface-2);
            border: 1px solid var(--border);
            border-radius: 10px;
            color: var(--text);
            font-family: inherit;
            font-size: 0.88rem;
            resize: none;
            min-height: 42px;
            max-height: 120px;
            transition: border-color 0.2s;
        }

        .input-bar textarea::placeholder {
            color: var(--text-dim);
        }

        .input-bar textarea:focus {
            outline: none;
            border-color: var(--accent);
        }

        .send-btn {
            padding: 10px 18px;
            background: linear-gradient(135deg, #7c5cfc, #6347d6);
            border: none;
            border-radius: 10px;
            color: white;
            font-family: inherit;
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
            transition: transform 0.15s;
            align-self: flex-end;
        }

        .send-btn:hover:not(:disabled) {
            transform: translateY(-1px);
        }

        .send-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 14px;
            min-width: 0;
        }

        .header-copy {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .header-copy small {
            color: var(--text-dim);
            font-size: 0.75rem;
        }

        .mini-btn {
            display: none;
            padding: 7px 12px;
            background: var(--surface-2);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text);
            font-family: inherit;
            font-size: 0.78rem;
            font-weight: 600;
            cursor: pointer;
        }

        .mini-btn.visible {
            display: inline-flex;
            align-items: center;
        }

        .mini-btn.active {
            background: rgba(124, 92, 252, 0.15);
            border-color: rgba(124, 92, 252, 0.35);
        }

        .mini-btn.alert {
            background: rgba(248, 113, 113, 0.14);
            color: #fca5a5;
            border-color: rgba(248, 113, 113, 0.3);
        }

        .status-dot.connecting {
            background: #fbbf24;
            box-shadow: 0 0 8px rgba(251, 191, 36, 0.5);
            animation: pulse 1.4s infinite;
        }

        .meter-wrap {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 6px 10px;
            border-radius: 999px;
            border: 1px solid var(--border);
            background: rgba(255, 255, 255, 0.04);
        }

        .meter-wrap span {
            font-size: 0.7rem;
            color: var(--text-dim);
            text-transform: uppercase;
            letter-spacing: 0.08em;
        }

        #volumeMeter {
            width: 80px;
            height: 20px;
            display: block;
            border-radius: 999px;
            background: #11111a;
        }

        .recovery-banner {
            margin: 12px 20px 0;
            padding: 10px 14px;
            border-radius: 10px;
            border: 1px solid rgba(124, 92, 252, 0.28);
            background: rgba(124, 92, 252, 0.08);
            color: #d9d2ff;
            font-size: 0.8rem;
        }

        .modes {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .mode-tabs {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .mode-tab {
            padding: 8px 12px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 999px;
            color: var(--text-dim);
            font-family: inherit;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
        }

        .mode-tab.active {
            color: white;
            background: rgba(124, 92, 252, 0.18);
            border-color: rgba(124, 92, 252, 0.38);
        }

        @media (max-width: 500px) {
            .header {
                flex-direction: column;
                align-items: stretch;
            }

            .header-left {
                justify-content: space-between;
            }

            .config-bar {
                flex-direction: column;
                align-items: stretch;
            }

            .api-key-input {
                min-width: unset;
            }
        }
    </style>
</head>

<body>
    <!-- Header -->
    <div class="header">
        <div class="header-left">
            <div class="header-copy">
                <h1>LiveGo - Gemini 3.1 Flash Live</h1>
                <small>Mic, texto, audio, transcricoes incrementais e recovery local</small>
            </div>
            <div class="meter-wrap">
                <span>Input</span>
                <canvas id="volumeMeter" width="80" height="20"></canvas>
            </div>
        </div>
        <div class="header-actions">
            <div class="status-dot" id="statusDot"></div>
            <button class="mini-btn" id="muteBtn" type="button" onclick="toggleMute()">Mute</button>
            <button class="mini-btn" id="speakerBtn" type="button" onclick="toggleSpeaker()">Speaker</button>
            <button class="connect-btn off" id="connectBtn" onclick="toggleConnection()">Conectar</button>
        </div>
    </div>

    <!-- Config -->
    <div class="config-bar">
        <div style="flex:1; min-width:200px;">
            <label>API Key</label><br>
            <input type="password" id="apiKey" class="api-key-input" placeholder="Cole sua Gemini API Key...">
        </div>
        <div>
            <label>Tools</label><br>
            <select id="toolsMode">
                <option value="none">Sem tools</option>
                <option value="all">Google Search + Ghost-Search + Functions</option>
                <option value="search_only">Apenas Google Search</option>
                <option value="ghost_only">Apenas Ghost-Search</option>
            </select>
        </div>
        <div class="toggle-row">
            <input type="checkbox" id="playAudio" checked>
            <span>Tocar audio automaticamente</span>
        </div>
        <div class="modes">
            <label>Modo de envio</label>
            <div class="mode-tabs" id="modeTabs">
                <button class="mode-tab active" type="button" data-mode="mic_text">Mic + Texto</button>
                <button class="mode-tab" type="button" data-mode="mic_only">So Mic</button>
                <button class="mode-tab" type="button" data-mode="text_only">So Texto</button>
            </div>
        </div>
    </div>

    <div class="recovery-banner" id="recoveryBanner" hidden></div>

    <!-- Chat -->
    <div class="chat-area" id="chat">
        <div class="msg system">
            Conecte para conversar com o Gemini Live.<br>
            Input: mic e/ou texto. Output: audio com transcricao em tempo real.<br>
            Modelo atual: gemini-3.1-flash-live-preview.
        </div>
    </div>

    <!-- Input -->
    <div class="input-bar">
        <textarea id="userInput" placeholder="Digite sua mensagem... (Ctrl+Enter para enviar)" rows="1"
            disabled></textarea>
        <button class="send-btn" id="sendBtn" onclick="sendMessage()" disabled>Enviar</button>
    </div>
    <!-- SDK -->
    <script type="module" src="./test.js"></script>
</body>

</html>
